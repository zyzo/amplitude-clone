services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: local-development-password
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: development
    command: ["sh", "-c", "npm run migrate && npm run dev:server"]
    environment:
      DATABASE_URL: postgres://analytics:local-development-password@db:5432/analytics
      API_TOKEN: local-development-token-at-least-32-characters
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    init: true

volumes:
  dev_postgres_data:
